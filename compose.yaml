services:
  comicdb:
    build:
      context: .
    image: comicdb:local
    restart: unless-stopped
    ports:
      - "${COMICDB_BIND_ADDRESS:-127.0.0.1}:${COMICDB_PORT:-3000}:8080"
    expose:
      - "8080"
    environment:
      APP_ORIGIN: "${APP_ORIGIN:-http://localhost:3000}"
      DATA_DIR: /data
      BACKUP_DIR: /backups
      SESSION_DAYS: "${SESSION_DAYS:-30}"
      TRUSTED_PROXY_CIDRS: "${TRUSTED_PROXY_CIDRS:-}"
      AUTO_BACKUP: "${AUTO_BACKUP:-true}"
      COMICDB_API_READ_TOKEN: "${COMICDB_API_READ_TOKEN:-}"
      COMICDB_API_WRITE_TOKEN: "${COMICDB_API_WRITE_TOKEN:-}"
      GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID:-}"
      GOOGLE_CLIENT_SECRET: "${GOOGLE_CLIENT_SECRET:-}"
      GOOGLE_PICKER_API_KEY: "${GOOGLE_PICKER_API_KEY:-}"
      GOOGLE_CLOUD_PROJECT_NUMBER: "${GOOGLE_CLOUD_PROJECT_NUMBER:-}"
      GOOGLE_TOKEN_ENCRYPTION_KEY: "${GOOGLE_TOKEN_ENCRYPTION_KEY:-}"
    volumes:
      - comicdb-data:/data
      - "${COMICDB_BACKUP_DIR:-./backups}:/backups"
    networks:
      default:
      relay-ingress:
        aliases:
          - comicdb
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8080/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  comicdb-data:

networks:
  default:
  relay-ingress:
    external: true
    name: onprem-relay-ingress
